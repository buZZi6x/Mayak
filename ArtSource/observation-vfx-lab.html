function frame(now){if(!cv.isConnected)return;const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)t=(t+dt)%catalog[kind].duration;range.value=t;let width=Math.max(280,cv.clientWidth);cv.width=Math.round(width*Math.min(devicePixelRatio,2));cv.height=Math.round(cv.width*9/16);gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);for(let i=0;i<params.length;i++){const q=params[i],r=point(kind,q[0],q[1],q[2],t);vertices.set([r[0],r[1],r[2],q[0],q[1],q[2]],i*6);}gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.DYNAMIC_DRAW);const d=catalog[kind];gl.uniform1f(gl.getUniformLocation(pr,'aspect'),cv.width/cv.height);gl.uniform1f(gl.getUniformLocation(pr,'kind'),kind);gl.uniform1f(gl.getUniformLocation(pr,'time'),t);gl.uniform3fv(gl.getUniformLocation(pr,'color'),d.color);gl.uniform3fv(gl.getUniformLocation(pr,'accent'),d.accent);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
